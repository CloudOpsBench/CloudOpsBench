[task]
name = "delete-decommissioned-s3-buckets"
description = "Delete every vera2 S3 bucket in us-east-1 as part of decommissioning the project"

[metadata]
category = "Decommissioning"
initial_state_description = """
A general-purpose S3 bucket with a vera2-data- prefix and an S3 table bucket with a vera2-warehouse-
prefix are created in us-east-1. Table buckets belong to the separate s3tables service and are not
returned by list-buckets.
"""
outcome_description = """
Neither the general-purpose bucket nor the table bucket exists. The table-bucket listing must be
readable for the grader to confirm the table bucket is gone.
"""
criteria_descriptions = [
  "the seeded general-purpose bucket no longer exists",
  "the seeded table bucket's ARN no longer appears in the region's table-bucket listing",
  "the table-bucket listing call succeeds (a listing error counts as a failure)",
]
keywords = ["aws", "s3", "s3tables", "decommissioning"]
extra_tools = []
