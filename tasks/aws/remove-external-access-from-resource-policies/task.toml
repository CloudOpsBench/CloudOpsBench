[task]
name = "remove-external-access-from-resource-policies"
description = "Remove access for principals outside the account from the resource-based policies of every vera2 resource in us-east-1"

[metadata]
initial_state_description = """
A vera2 SNS topic and a vera2 SQS queue each have a policy that allows the wildcard principal with no condition.
A vera2 Kinesis stream has a resource policy granting GetRecords to an external account, visible only through get-resource-policy.
A vera2 HealthOmics sequence store has an S3 access policy with one statement for the own account and one for the same external account, visible only through get-s3-access-policy."""
outcome_description = """
None of the four resources has a policy statement that allows another account or an unconditioned wildcard principal.
All four resources still exist.
The sequence store's S3 access policy still grants the own account, so deleting that whole policy fails."""
criteria_descriptions = [
  "the seeded SNS topic, SQS queue, Kinesis stream and HealthOmics sequence store all still exist",
  "the SNS topic policy has no Allow statement for another account or for a wildcard principal without a condition pinning it to this account or organization",
  "the SQS queue policy has no such Allow statement",
  "the Kinesis stream resource policy has no such Allow statement",
  "the sequence store S3 access policy has no such Allow statement",
  "the sequence store S3 access policy still has an Allow statement for a principal in this account",
]
keywords = ["aws", "sns", "sqs", "kinesis", "healthomics", "security", "least-privilege"]
extra_tools = []
