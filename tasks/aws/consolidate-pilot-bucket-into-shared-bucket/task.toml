[task]
name = "consolidate-pilot-bucket-into-shared-bucket"
description = "Move a pilot dataset from its S3 bucket into the team's shared bucket under the same keys and leave the source bucket empty"

[metadata]
category = "Migration & Deployment"
initial_state_description = """
Setup creates a `vera2-` source bucket ending in `-pilot` and a destination bucket ending in
`-shared` in us-east-1. The source holds two objects under `data/` and the shared bucket holds one
readme object. The source also has an in-progress multipart upload for a third `data/` key with one
uploaded 5 MiB part, which does not show in an object listing.
"""
outcome_description = """
The shared bucket contains the two source objects, the object assembled from the multipart upload and
its original readme, each with the recorded size and SHA-256. The source bucket has no objects and no
in-progress multipart uploads, and both buckets still exist.
"""
criteria_descriptions = [
  "the source bucket still exists",
  "the shared bucket still exists",
  "the source bucket contains no objects",
  "the source bucket has no in-progress multipart uploads",
  "the shared bucket's key set is exactly the three dataset keys plus the existing readme key",
  "each of those four objects can be read from the shared bucket",
  "each of those four objects matches the recorded size and SHA-256, including the one that was only an uploaded multipart part",
  "the shared bucket has no in-progress multipart uploads",
]
keywords = ["aws", "s3", "data-migration", "decommissioning"]
extra_tools = []
