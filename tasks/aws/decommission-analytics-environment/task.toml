[task]
name = "decommission-analytics-environment"
description = "Tear down a finished analytics environment by removing every resource named with its prefix"

[metadata]
initial_state_description = """
Setup creates an Athena workgroup, a Secrets Manager secret, an SSM SecureString parameter and an SQS
queue in the home region, all named with the `aaq-7c21` prefix. A second Athena workgroup and SSM
parameter with the same prefix are in a different region. Nothing is tagged, so the prefix appears
only in resource names.
"""
outcome_description = """
No Athena workgroup, listed Secrets Manager secret, SSM parameter or SQS queue carrying the prefix
remains in either region. A secret scheduled for deletion counts as removed.
"""
criteria_descriptions = [
  "the seed state is readable and contains the environment prefix",
  "no Athena workgroup whose name contains the prefix is listed in either region",
  "no Secrets Manager secret whose name contains the prefix is listed in either region (secrets pending deletion are not listed)",
  "no SSM parameter whose name contains the prefix or a `/7c21/` path segment is listed in either region",
  "no SQS queue whose name starts with the prefix is listed in either region",
]
keywords = ["aws", "athena", "secretsmanager", "ssm", "sqs", "decommissioning", "multi-region"]
extra_tools = []
