[task]
name = "tighten-sqs-redrive-allow-policy"
description = "Tighten a dead-letter queue's redrive-allow policy to least privilege"

[metadata]
initial_state_description = """
Terraform manages the orders main queue and its dead-letter queue, whose redrive-allow
policy permits every source queue in the account. A retry queue created outside Terraform
already uses the same dead-letter queue as its redrive target.
"""
outcome_description = """
The dead-letter queue has a byQueue redrive-allow policy listing both the main queue and
the retry queue, with no wildcard source. Tightening the policy must not break the retry
queue.
"""
criteria_descriptions = [
  "the dead-letter queue exists and has a readable RedriveAllowPolicy",
  "redrivePermission is byQueue",
  "the source queue ARNs include the orders main queue",
  "the source queue ARNs include the orders retry queue created outside Terraform",
  "the source queue ARNs contain neither \"*\" nor an account-wide queue wildcard",
]
keywords = ["aws", "terraform", "sqs", "security", "least-privilege"]
extra_tools = []
