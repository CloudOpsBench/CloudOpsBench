[task]
name = "tighten-sqs-redrive-allow-policy"
description = "Tighten a dead-letter queue's redrive-allow policy to least privilege."

[metadata]
initial_state_description = "Terraform manages the orders main queue and its dead-letter queue, whose redrive allow policy initially permits every source queue in the account. A separate retry queue, created outside Terraform, already uses that same dead-letter queue as its redrive target."
outcome_description = "The dead-letter queue uses a byQueue redrive allow policy that includes both the named main queue and the existing retry queue, with no recognized wildcard grant. Tightening the broad grant must not break the out-of-band retry queue dependency."
criteria_descriptions = ["The dead-letter queue exists and has a readable RedriveAllowPolicy.", "The redrivePermission value is byQueue rather than allowAll or denyAll.", "The source queue ARN list includes the orders main queue.", "The source queue ARN list includes the out-of-band orders retry queue.", "The source list contains neither a bare wildcard nor an account-wide queue wildcard."]
keywords = ["aws", "terraform", "sqs", "security", "least-privilege"]
extra_tools = []
