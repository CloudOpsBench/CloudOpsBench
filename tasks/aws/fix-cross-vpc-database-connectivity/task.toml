[task]
name = "fix-cross-vpc-database-connectivity"
description = "Fix app servers in prod-vpc timing out when connecting to the database in shared-vpc."

[metadata]
initial_state_description = "prod-vpc (10.0.0.0/16) and shared-vpc (172.16.0.0/16) each have two subnets associated with a custom route table and are joined by an active peering connection, but neither route table has a route to the other VPC. shared-rds-sg, tagged as the primary PostgreSQL database, has no inbound rule for port 5432. prod-vpc has ten security groups whose names do not match their Role tags, so the application tier is prod-web-sg, and shared-vpc has four other unrelated security groups."
outcome_description = "Both custom route tables have an active route to the other VPC's CIDR through the existing peering connection, and shared-rds-sg allows inbound TCP 5432 from the application-tier security group or from the prod-vpc CIDR. The original peering connection must remain active and all four subnets must stay associated with their custom route tables."
criteria_descriptions = ["The original VPC peering connection is still active.", "prod-custom-rt has an active route to 172.16.0.0/16 through that peering connection.", "shared-custom-rt has an active route to 10.0.0.0/16 through that peering connection.", "shared-rds-sg has an inbound TCP or all-protocol rule covering port 5432 whose source is the application-tier security group (prod-web-sg) or exactly 10.0.0.0/16.", "prod-subnet-a and prod-subnet-b are still associated with prod-custom-rt.", "shared-subnet-a and shared-subnet-b are still associated with shared-custom-rt."]
keywords = ["aws", "vpc", "ec2", "networking", "troubleshooting"]
extra_tools = []
