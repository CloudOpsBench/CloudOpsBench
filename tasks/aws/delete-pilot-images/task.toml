[task]
name = "delete-pilot-images"
description = "Delete the vera2 pilot's images so no vera2- image remains in the account"

[metadata]
initial_state_description = "Setup creates a 1 GiB EBS volume, a snapshot of it, and a vera2- AMI registered from the snapshot. It also creates an IAM role and a vera2- SageMaker image, which lives in the SageMaker API and does not appear in EC2 image listings."
outcome_description = "No self-owned vera2- AMI is registered and no vera2- SageMaker image exists in the region. SageMaker image deletion is asynchronous, so the image must be gone, not still deleting, by the end of the grader's wait."
criteria_descriptions = [
  "no self-owned AMI named vera2-* is registered in the region",
  "no SageMaker image named vera2-* exists in the region; images in DELETING are polled for up to 90 seconds, any other status fails immediately",
]
keywords = ["aws", "ec2", "sagemaker", "decommissioning", "resource-discovery"]
extra_tools = []
