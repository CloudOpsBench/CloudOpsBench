[task]
name = "decommission-data-pipeline"
description = "Fully decommission the deprecated adt- data pipeline by removing every resource that carries its name prefix"

[metadata]
category = "Decommissioning"
initial_state_description = """
A small pipeline is built with a per-run adt- name prefix and no tags, so a tag inventory cannot
find it. The home region holds a DynamoDB table, a Kinesis stream, an empty ECR repository and an SQS
queue. A second region holds another table and stream with the same names, which a single-region
sweep misses.
"""
outcome_description = """
No active DynamoDB table or Kinesis stream, and no ECR repository or SQS queue, carrying the prefix
remains in either region. Tables and streams that are already deleting count as removed. The
instruction also says not to touch anything outside the adt- prefix, but only the removal is graded.
"""
criteria_descriptions = [
  "the seed state is readable and contains the pipeline's name prefix",
  "no DynamoDB table whose name contains the prefix is still ACTIVE in either region",
  "no Kinesis stream whose name contains the prefix is still ACTIVE in either region",
  "no ECR repository whose name contains the prefix exists in either region",
  "no SQS queue whose name starts with the prefix is listed in either region",
]
keywords = ["aws", "dynamodb", "kinesis", "ecr", "sqs", "decommissioning", "multi-region"]
extra_tools = []
