schema_version = "1.4"

[task]
name = "cloudopsbench/aws-decommission-data-pipeline"
description = "Fully decommission a prefixed data pipeline without touching anything else."
keywords = ["aws", "decommission", "dynamodb", "kinesis", "ecr", "sqs", "multi-region"]

# CloudOpsBench conventions; status is NOT an execution gate in Harbor.
[metadata]
id = "aws/decommission-data-pipeline"
provider = "aws"
category = "cost"
difficulty = "hard"
status = "experimental"
source = "ext_archit_decommission_data_1e30c5c0"

[agent]
timeout_sec = 1800.0
user = "agent"

[verifier]
timeout_sec = 600.0
user = "root"
# Shared-container grading is not claimed tamper-proof.
environment_mode = "shared"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
# The runner supplies a fresh emulator and phase-scoped model-provider egress.
network_mode = "no-network"

# The entrypoint seeds the starting cloud state; the agent starts only once it is in place.
[environment.healthcheck]
command = "test -f /run/cloudopsbench/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 600.0
start_interval_sec = 2.0
retries = 3
