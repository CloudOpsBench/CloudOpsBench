[task]
name = "reconnect-tagged-alarms-to-sns-topic"
description = "Wire tagged CloudWatch alarms back to their SNS notification topic"

[metadata]
category = "Configuration & Monitoring"
initial_state_description = """
Two regions each have an SNS topic tagged App=nightbell.
Three CloudWatch alarms are tagged App=nightbell: two metric alarms in the home region and one composite alarm in the other region.
A failover drill left only one of them with an alarm action.
A decoy alarm tagged App=drill and other unrelated alarms are also present."""
outcome_description = """
Every alarm tagged App=nightbell, in any region, has its region's App=nightbell topic as an alarm action.
The App=drill decoy and all other alarms keep their original configuration and tags."""
criteria_descriptions = [
  "both seeded App=nightbell topics still exist and keep their App=nightbell tag",
  "each seeded App=nightbell alarm still exists, has its region's seeded topic as an alarm action, and keeps its App=nightbell tag",
  "the App=drill decoy alarm still exists with its original configuration and tags",
  "every metric or composite alarm tagged App=nightbell in any region has an App=nightbell topic from its own region as an alarm action",
  "at least three App=nightbell alarms are found",
  "every other alarm recorded at setup still exists with its original configuration and tags",
]
keywords = ["aws", "cloudwatch", "sns", "alerting", "multi-region"]
extra_tools = []
