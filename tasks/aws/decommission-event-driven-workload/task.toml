[task]
name = "decommission-event-driven-workload"
description = "Fully dismantle the retired aeb-<region> event-driven workload so that no resource with that prefix remains anywhere"

[metadata]
initial_state_description = """
Setup creates a disabled scheduled EventBridge rule, an SQS queue and an SNS topic in the home region,
all named with the aeb-<region> prefix. It also creates a second disabled rule and SQS queue with the
same names in another region (us-west-2, or us-east-1 when the home region is us-west-2). Nothing is
tagged, so tag-based lookups cannot find the resources.
"""
outcome_description = """
No EventBridge rule, SQS queue or SNS topic carrying the aeb-<region> prefix remains in either
region. A cleanup limited to the home region, or one that skips EventBridge rules, fails.
"""
criteria_descriptions = [
  "the seed state file written by setup is readable and contains the workload prefix",
  "no EventBridge rule with the prefix in its name remains in either region",
  "no SQS queue whose name starts with the prefix remains in either region",
  "no SNS topic with the prefix in its ARN remains in either region",
]
keywords = ["aws", "eventbridge", "sqs", "sns", "decommissioning", "multi-region"]
extra_tools = []
