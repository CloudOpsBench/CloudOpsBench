schema_version = "1.4"

[task]
name = "cloudopsbench/aws-create-secure-s3-bucket"
description = "Create a versioned, encrypted S3 bucket with public access blocked."
keywords = ["aws", "terraform", "s3", "storage", "security"]

# CloudOpsBench conventions; status is NOT an execution gate in Harbor.
[metadata]
id = "aws/create-secure-s3-bucket"
provider = "aws"
category = "storage"
difficulty = "easy"
status = "scaffold"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0
# TODO: integrate a separate trusted verifier before untrusted evaluation.
environment_mode = "shared"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
# TODO: implement and verify emulator/model routing and real-cloud egress denial.
network_mode = "no-network"
