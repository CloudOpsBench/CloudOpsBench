[task]
name = "delete-pilot-ebs-volumes"
description = "Delete the retired vera2 pilot's EBS volumes and leave other teams' volumes alone"

[metadata]
category = "Decommissioning"
initial_state_description = """
One available gp3 volume named with a vera2- prefix and tagged Project=vera2 exists in us-east-1. A
Recycle Bin retention rule holds deleted EBS volumes tagged Project=vera2 for seven days. Setup
confirms the rule is enforcing, then clears its test volumes from the Recycle Bin. A plain delete
moves the volume into the Recycle Bin, where it stays restorable and no longer shows in the ordinary
volume listing.
"""
outcome_description = """
The pilot's volume is gone from the ordinary volume listing and is not in the Recycle Bin. Deleting
it while the retention rule still covers it is not enough. Only this volume is graded, not other
volumes.
"""
criteria_descriptions = [
  "the pilot's volume is not returned by the ordinary volume lookup, or is returned only in the deleting state",
  "the pilot's volume is not in the Recycle Bin, polled for about 105 seconds while a retention rule for Project=vera2 volumes exists and about 21 seconds otherwise",
]
keywords = ["aws", "ec2", "ebs", "recycle-bin", "decommissioning"]
extra_tools = []
