[task]
name = "restore-dynamodb-write-autoscaling"
description = "Fix a provisioned DynamoDB table whose write capacity is stuck at 2 so it auto-scales between 2 and 10"

[metadata]
initial_state_description = """
A provisioned vera2-orders- table has its write capacity registered as an Application Auto Scaling
target with minimum and maximum both 2, plus a target-tracking policy on write utilization. A
separate enabled EventBridge Scheduler schedule, with its own IAM role, re-registers the target at
2/2 every 30 minutes starting one day after setup, so widening the range alone gets reverted."""
outcome_description = """
The original table and target-tracking policy remain in place, and the policy still allows
scale-in. The write-capacity scalable target has minimum 2 and maximum 10 with dynamic scaling not
suspended, and no enabled schedule would re-register it with any other range or suspend its dynamic
scaling. The table stays in provisioned billing mode."""
criteria_descriptions = [
  "the original table still exists and its billing mode is PROVISIONED",
  "the table's write capacity is still a registered scalable target",
  "the scalable target has MinCapacity 2 and MaxCapacity 10",
  "dynamic scaling in and out is not suspended on the scalable target",
  "no enabled EventBridge Scheduler schedule, in any schedule group, calls RegisterScalableTarget for this table's write capacity with a MinCapacity other than 2, a MaxCapacity other than 10, or dynamic scaling suspended",
  "the original TargetTrackingScaling policy still exists on the table's write capacity",
  "the original TargetTrackingScaling policy does not have scale-in disabled",
  "the table, scalable targets, schedules and scaling policies can be read without an API error (a schedule deleted between listing and reading is skipped)",
]
keywords = ["aws", "dynamodb", "application-autoscaling", "eventbridge-scheduler", "troubleshooting"]
extra_tools = []
