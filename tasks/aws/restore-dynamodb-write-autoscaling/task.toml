[task]
name = "restore-dynamodb-write-autoscaling"
description = "Fix a provisioned DynamoDB table whose write capacity is stuck at 2 so it auto-scales between 2 and 10"

[metadata]
category = "Configuration & Monitoring"
initial_state_description = """
A provisioned vera2-orders- table has its write capacity registered as an Application Auto Scaling
target with minimum and maximum both 2, plus a target-tracking policy on write utilization. A
separate enabled EventBridge Scheduler schedule, with its own IAM role, re-registers the target at
2/2 every 30 minutes starting one day after setup, so widening the range alone gets reverted."""
outcome_description = """
The write-capacity scalable target has minimum 2 and maximum 10, and no enabled schedule would
re-register it with a lower maximum or a fixed capacity. The table stays in provisioned billing
mode and keeps a target-tracking policy on its write capacity."""
criteria_descriptions = [
  "the table still exists and its billing mode is PROVISIONED",
  "the table's write capacity is still a registered scalable target",
  "the scalable target has MinCapacity 2 and MaxCapacity 10",
  "no enabled EventBridge Scheduler schedule calls RegisterScalableTarget for this table with MaxCapacity below 10",
  "no enabled EventBridge Scheduler schedule calls RegisterScalableTarget for this table with MinCapacity equal to MaxCapacity",
  "a TargetTrackingScaling policy still exists on the table's write capacity",
  "the table, scalable targets, schedule list and scaling policies can be read without an API error (schedules that cannot be read individually are skipped)",
]
keywords = ["aws", "dynamodb", "application-autoscaling", "eventbridge-scheduler", "troubleshooting"]
extra_tools = []
