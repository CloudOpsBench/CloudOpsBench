schema_version = "1.4"

[task]
name = "cloudopsbench/aws-create-s3-bucket"
description = "Smoke test: create one S3 bucket in an isolated emulator."
keywords = ["aws", "s3", "smoke-test"]

[metadata]
id = "aws/create-s3-bucket"
provider = "aws"
category = "provisioning"
difficulty = "easy"
status = "smoke-test"

[agent]
timeout_sec = 120.0
user = "agent"

[verifier]
timeout_sec = 60.0
user = "root"
environment_mode = "shared"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
network_mode = "no-network"
