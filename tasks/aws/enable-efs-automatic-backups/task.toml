outcome_description = "Every seeded vera2 file system in both regions still exists and has backup policy status ENABLED or ENABLING."
criteria_descriptions = [
  "each seeded file system in the default region has a readable backup policy with status ENABLED or ENABLING",
  "the seeded file system in us-west-2 has a readable backup policy with status ENABLED or ENABLING",
]
keywords = ["aws", "efs", "backup", "multi-region"]
