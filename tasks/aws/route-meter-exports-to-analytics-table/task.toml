[task]
name        = "route-meter-exports-to-analytics-table"
description = "Route every meter interval exporter into the dataset the analytics table reads"

[metadata]

initial_state_description = """
A utility metering platform exports interval readings through Amazon Data Firehose. Four
exporters each have an EXPORT_DELIVERY_STREAM setting naming their delivery stream: an AWS
Batch job definition, an AWS Glue job, a Lambda function that runs under its live alias,
and a CodeBuild project in a second region that feeds the same streams. Two active
delivery streams in us-east-1 write to two different S3 buckets. The analytics team
queries a Glue Data Catalog table named interval_readings, and no reading has ever
appeared in it."""

outcome_description = """
Every exporter delivers through a Firehose delivery stream into the S3 location the
interval_readings table reads, and records sent actually land there. Any stream that
writes to that location works, including a new one. Neither seeded stream is deleted or
repointed, and the interval_readings table definition is unchanged."""

criteria_descriptions = [
  "invoking the Lambda exporter through its live alias succeeds, and the stream it writes to delivers to the interval_readings table location",
  "the latest active revision of the Batch job definition names a stream that delivers to that location",
  "the CodeBuild exporter in the second region names a stream that delivers to that location",
  "the Glue job's effective EXPORT_DELIVERY_STREAM argument (the non-overridable one if both are set) names a stream that delivers to that location",
  "each stream the exporters name has a delivery role that IAM simulation allows to write there, or a probe record put on it lands there within the buffering window",
  "both seeded delivery streams still exist, are ACTIVE, and keep their destination settings apart from the delivery role",
  "the interval_readings table definition is unchanged apart from fields AWS maintains",
]

keywords = ["firehose", "glue", "batch", "lambda", "codebuild", "routing"]
extra_tools = []
