schema_version = "1.4"

[task]
name = "cloudopsbench/aws-tighten-kinesis-resource-policy"
description = "Tighten a Kinesis data stream's resource policy to least privilege."
keywords = ["aws", "terraform", "kinesis", "iam", "security", "least-privilege"]

# CloudOpsBench conventions; status is NOT an execution gate in Harbor.
[metadata]
id = "aws/tighten-kinesis-resource-policy"
provider = "aws"
category = "security"
difficulty = "hard"
status = "experimental"
source = "aws_task20_kinesis_resource_policy_sever_1540bf36"

[agent]
timeout_sec = 1800.0
user = "agent"

[verifier]
timeout_sec = 600.0
user = "root"
# Shared-container grading is not claimed tamper-proof.
environment_mode = "shared"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
# The runner supplies a fresh emulator and phase-scoped model-provider egress.
network_mode = "no-network"

# The entrypoint seeds the starting cloud state; the agent starts only once it is in place.
[environment.healthcheck]
command = "test -f /run/cloudopsbench/ready"
interval_sec = 5.0
timeout_sec = 10.0
start_period_sec = 600.0
start_interval_sec = 2.0
retries = 3
