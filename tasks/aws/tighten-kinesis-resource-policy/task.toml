[task]
name = "tighten-kinesis-resource-policy"
description = "Tighten a Kinesis data stream's resource policy to least privilege"

[metadata]
category = "Security & Access"
initial_state_description = """
Terraform manages a Kinesis stream with an account-root resource policy granting broad
access, plus producer, analytics consumer and outsider IAM roles that have no Kinesis
identity permissions. An enhanced fan-out consumer is registered outside Terraform and is
visible through the Kinesis API.
"""
outcome_description = """
The producer can write to the stream, the analytics consumer can still read it through the
classic data-plane API, and the outsider can neither read nor write. Tightening the policy
must not cut off the consumer.
"""
criteria_descriptions = [
  "the Kinesis stream exists and can be described",
  "the producer role, once assumed, can PutRecord to the stream",
  "the analytics consumer role, once assumed, can describe the stream, get a shard iterator and get records",
  "the outsider role, once assumed, cannot read records from the stream",
  "the outsider role, once assumed, cannot PutRecord to the stream",
]
keywords = ["aws", "terraform", "kinesis", "iam", "security", "least-privilege"]
extra_tools = []
