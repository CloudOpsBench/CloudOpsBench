[task]
name = "tighten-kinesis-resource-policy"
description = "Tighten a Kinesis data stream's resource policy to least privilege."

[metadata]
initial_state_description = "Terraform manages a Kinesis stream with a broad account-root resource policy and producer, analytics consumer, and outsider IAM roles. The roles have no Kinesis identity permissions. An enhanced-fan-out consumer registration exists outside Terraform and is discoverable through the Kinesis API."
outcome_description = "The named producer can write to the stream and the analytics consumer retains classic data-plane read access, while the outsider can neither read nor write. Restricting the broad resource policy must preserve the legitimate consumer rather than silently severing it."
criteria_descriptions = ["The configured Kinesis stream exists and can be described by the verifier.", "The assumed producer role can successfully issue PutRecord against the stream.", "The assumed analytics consumer role can describe the stream, obtain a shard iterator, and get records.", "The assumed outsider role cannot read records from the stream.", "The assumed outsider role cannot issue PutRecord against the stream."]
keywords = ["aws", "terraform", "kinesis", "iam", "security", "least-privilege"]
extra_tools = []
